<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长视频生成 Agent · 工作台原型</title>
<style>
  :root{
    /* 表面与线条 */
    --bg:#ECE8DE; --panel:#F6F4EF; --card:#FFFFFF; --line:#E4DFD3;
    --line-2:#ECE9DF; --wire:#C3BDAE;
    /* 文字层级 */
    --txt:#1C1C1E; --txt-2:#5C5C5E; --txt-3:#8E8E93;
    /* 品牌色：深海蓝青 */
    --accent:#2563EB; --primary:#2563EB; --primary-2:#06B6D4;
    --primary-grad:linear-gradient(135deg,#2563EB,#06B6D4);
    --green:#16A34A; --green-soft:#DCFCE7; --green-line:#86C995;
    --amber:#D97706; --amber-soft:#FEF3C7; --amber-line:#FCD34D;
    --red:#DC2626; --red-soft:#FEE2E2;
    /* 圆角 token */
    --r:14px; --r-sm:9px; --r-lg:18px;
    /* 阴影层级 */
    --sh-1:0 1px 2px rgba(28,28,30,.04),0 2px 8px rgba(28,28,30,.05);
    --sh-2:0 4px 12px rgba(28,28,30,.08),0 12px 28px rgba(28,28,30,.10);
    --sh-3:0 24px 60px rgba(28,28,30,.22);
    --sh-active:0 0 0 1px var(--accent),0 10px 30px rgba(37,99,235,.18);
    --sh-done:0 0 0 1px var(--green-line),0 10px 30px rgba(22,163,74,.14);
    /* 动效 */
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --ease-std:cubic-bezier(.2,0,0,1);
    --dur:.25s;
    /* 字体 */
    --font-display:'Space Grotesk','Outfit','Noto Sans SC',system-ui,sans-serif;
    --font-body:'Inter','Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    --font-mono:'JetBrains Mono','SF Mono','Consolas',monospace;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:var(--font-body);letter-spacing:-0.01em}
  body{background:var(--bg);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{display:flex;height:100vh;flex-direction:column}

  /* 极简顶部状态条（参考截图：5 个圆角 chip 胶囊，右侧安全闸门） */
  .topbar{
    display:flex;align-items:center;gap:6px;
    padding:8px 14px;background:rgba(255,255,255,.55);
    border-bottom:1px solid var(--line);flex-wrap:wrap;
    backdrop-filter:blur(4px);font-size:11.5px;color:var(--txt-2)
  }
  .topbar .chip{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 11px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);
    font-size:11.5px;color:var(--txt-2);white-space:nowrap;line-height:1.5
  }
  .topbar .chip b{color:var(--txt);font-weight:600}
  .topbar .chip.mono{font-family:var(--font-mono)}
  .topbar .chip.mono b{font-weight:500;letter-spacing:.2px}
  .topbar .safe{
    margin-left:auto;display:inline-flex;align-items:center;gap:5px;
    padding:4px 11px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);
    font-size:11.5px;color:var(--txt-2);white-space:nowrap
  }
  .topbar .safe b{color:var(--green);font-weight:600;margin:0 4px 0 2px}
  .topbar .safe .pend{color:var(--amber);font-weight:600}

  /* Body */
  .main{flex:1;display:flex;min-height:0}

  /* Canvas (center) */
  .canvas-wrap{flex:1;display:flex;min-width:0;background:var(--bg);position:relative}

  /* 画布左侧导航栏 */
  .side-nav{
    width:156px;flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden
  }
  .side-nav-h{padding:11px 13px;font-size:11px;font-weight:600;color:var(--txt-2);
    border-bottom:1px solid var(--line);background:var(--card);letter-spacing:.4px;text-transform:uppercase}
  .side-nav-body{flex:1;overflow-y:auto;padding:9px 9px 14px}
  .side-nav-section{margin-bottom:14px}
  .side-nav-section h4{font-size:10.5px;font-weight:700;color:var(--txt-3);
    letter-spacing:.4px;text-transform:uppercase;margin:0 4px 6px}
  .side-nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .nav-thumb{
    position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;
    background:linear-gradient(135deg,#e9eef6,#dde7f2);
    display:flex;align-items:center;justify-content:center;font-size:18px;
    cursor:pointer;border:1px solid var(--line-2);
    transition:transform .15s var(--ease-std),border-color .15s var(--ease-std)
  }
  .nav-thumb:hover{transform:translateY(-1px);border-color:var(--accent)}
  .nav-thumb.vid{background:linear-gradient(135deg,#e6f4f1,#d6ece8);color:#1f9c86}
  .nav-thumb.vid.stale{background:linear-gradient(135deg,#fceccb,#f8ddaa);
    border-color:var(--amber-line);color:#a06a16}
  .nav-thumb .lab{position:absolute;bottom:2px;left:2px;right:2px;
    font-size:8px;line-height:1;color:#fff;background:rgba(0,0,0,.45);
    border-radius:3px;text-align:center;padding:1px 0;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-thumb .type{position:absolute;top:2px;left:2px;
    font-size:8px;line-height:1;color:#fff;background:rgba(0,0,0,.45);
    border-radius:3px;padding:1px 3px;font-weight:600}
  .nav-empty{font-size:10.5px;color:var(--txt-3);padding:10px 4px;text-align:center;line-height:1.5}

  /* Canvas (right area inside wrap) */
  .canvas{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);position:relative}

  /* 画布顶部工具条（演示 / 重置 按钮） */
  .canvas-toolbar{
    display:flex;align-items:center;gap:8px;
    padding:8px 16px;background:rgba(255,255,255,.7);
    border-bottom:1px solid var(--line)
  }
  .canvas-toolbar .spacer{flex:1}
  .btn{font-size:11.5px;font-weight:600;padding:7px 14px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);color:var(--txt);
    cursor:pointer;transition:.15s;box-shadow:var(--sh-1)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px}

  /* Canvas area (2D infinite feel) */
  .canvas-area{
    flex:1; overflow:auto; position:relative;
    background-color:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,.07) 1px, transparent 0);
    background-size:26px 26px;
  }
  .connections{position:absolute;top:0;left:0;width:1500px;height:900px;pointer-events:none;z-index:1}

  /* Card */
  .card{position:absolute;width:400px;z-index:2;cursor:pointer;
    transition:transform var(--dur) var(--ease-std),box-shadow var(--dur) var(--ease-std)}
  .card:hover{transform:translateY(-3px);filter:drop-shadow(0 8px 20px rgba(28,28,30,.08))}
  .card .filename{font-size:11px;color:var(--txt-3);margin-bottom:4px;padding-left:3px;
    font-family:var(--font-mono);letter-spacing:.2px}
  .card .filename .ed{margin-left:6px;color:var(--accent);opacity:0;transition:.15s;cursor:pointer}
  .card:hover .filename .ed{opacity:1}
  .card .content{
    position:relative;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:18px 22px; box-shadow:var(--sh-1);
    font-size:12.5px; line-height:1.7; color:var(--txt);
    transition: border-color .2s, box-shadow .2s;
  }
  .card.active .content{border-color:var(--accent);box-shadow:var(--sh-active)}
  .card.done .content{border-color:#b8d8a8;background:#fafdf6}
  .card.done .content::after{
    content:'✓'; position:absolute; top:14px; right:14px;
    width:22px; height:22px; background:var(--green); color:#fff;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; line-height:1;box-shadow:0 4px 10px rgba(22,163,74,.35)
  }
  .card.stale .content{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 10px 30px rgba(217,119,6,.16)}
  .stale-badge{display:inline-block;font-size:9.5px;font-weight:700;color:#fff;background:var(--amber);
    padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle;
    box-shadow:0 2px 6px rgba(217,119,6,.35)}
  .stale-badge.hidden{display:none}
  .stale-banner{background:#fdf3e3;border:1px solid #f3d9a8;color:#a06a16;
    font-size:11px;padding:7px 11px;border-radius:7px;margin-bottom:11px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:1.4}
  .stale-banner button{font-size:10.5px;font-weight:600;padding:4px 11px;border-radius:6px;
    border:1px solid var(--amber);background:var(--amber);color:#fff;
    cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(217,119,6,.3)}
  .stale-banner button:hover{filter:brightness(1.05)}
  .stale-banner button:active{transform:translateY(1px)}
  .card .content h2{font-size:17px;font-weight:700;margin-bottom:10px;color:var(--txt);letter-spacing:.3px;
    font-family:var(--font-display)}
  .card .content h3{font-size:11.5px;font-weight:700;margin-top:11px;margin-bottom:5px;
    color:var(--txt-2);letter-spacing:.4px;text-transform:uppercase}
  .card .content p{margin:5px 0;color:var(--txt-2)}
  .card .content ul{padding-left:18px;margin:5px 0}
  .card .content li{margin:2px 0;color:var(--txt-2)}
  .card .content .mono{font-family:var(--font-mono);font-size:11px;line-height:1.75;
    color:var(--txt-2);background:#f5f3ed;padding:8px 10px;border-radius:6px}

  .edit-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
  .edit-bar .asset-btn{flex:0 0 auto}
  .batch-bar{display:flex;justify-content:flex-end;margin-bottom:10px;gap:6px}
  .batch-bar .asset-btn{font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:7px;
    border:1px solid var(--accent);background:#EEF3FB;color:var(--accent);
    cursor:pointer;transition:.15s;box-shadow:var(--sh-1)}
  .batch-bar .asset-btn:hover{background:var(--accent);color:#fff}

  /* Asset tabs */
  .asset-tabs{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
  .asset-tab{font-size:11px;font-weight:600;padding:5px 12px;border-radius:99px;
    border:1px solid var(--line);background:var(--card);color:var(--txt-2);
    cursor:pointer;transition:all .15s var(--ease-std)}
  .asset-tab:hover{border-color:var(--accent)}
  .asset-tab.on{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 2px 8px rgba(37,99,235,.3)}

  /* Asset grid */
  .asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .asset-item{background:#faf9f4;border:1px solid var(--line-2);border-radius:var(--r-sm);
    overflow:hidden;display:flex;flex-direction:column;
    box-shadow:var(--sh-1);transition:transform var(--dur) var(--ease-spring),box-shadow var(--dur) var(--ease-std)}
  .asset-item:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
  .asset-thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#e9eef6,#dde7f2);
    display:flex;align-items:center;justify-content:center;font-size:30px;
    color:#3b6fb5;position:relative;border-radius:8px 8px 0 0}
  .asset-thumb .download-overlay{position:absolute;top:6px;right:6px;
    width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.92);
    border:1px solid var(--line);color:var(--txt-2);font-size:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:.15s;opacity:.7}
  .asset-thumb .download-overlay:hover{color:var(--accent);border-color:var(--accent)}
  .asset-type{position:absolute;top:6px;left:6px;font-size:9px;background:rgba(0,0,0,.45);
    color:#fff;padding:2px 7px;border-radius:99px;font-weight:600}
  .asset-info{padding:7px 9px 9px}
  .asset-name{font-size:11.5px;font-weight:600;color:var(--txt);font-family:var(--font-mono)}
  .asset-desc{font-size:10.5px;color:var(--txt-2);line-height:1.5;margin-top:3px}
  .asset-actions{display:flex;gap:6px;margin-top:7px}
  .asset-btn{font-size:10px;font-weight:600;padding:4px 9px;border-radius:6px;
    border:1px solid var(--line);background:var(--card);color:var(--txt-2);
    cursor:pointer;transition:all .15s var(--ease-std);flex:1;text-align:center;
    box-shadow:var(--sh-1)}
  .asset-btn:hover{border-color:var(--accent);color:var(--accent)}
  .asset-btn.regen:hover{border-color:var(--green);color:var(--green)}
  .asset-btn:active{transform:translateY(1px)}
  .asset-regened{font-size:9px;color:var(--green);margin-top:4px;
    font-family:var(--font-mono);display:none}
  .asset-regened.show{display:block}
  .spinner{width:18px;height:18px;border:2.5px solid rgba(0,0,0,.15);
    border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Storyboard */
  .sb-table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0 12px}
  .sb-table th,.sb-table td{border-bottom:1px solid var(--line-2);
    padding:5px 6px;text-align:left;vertical-align:top}
  .sb-table th{background:#F2F0EA;font-weight:600;color:var(--txt);font-size:10.5px;letter-spacing:.3px}
  .sb-table td{color:var(--txt-2)}
  .sb-table td b{color:var(--txt)}
  .sb-shot{background:#faf9f4;border:1px solid var(--line-2);border-radius:7px;
    padding:11px;margin-bottom:9px;box-shadow:var(--sh-1);
    transition:transform var(--dur) var(--ease-spring),box-shadow var(--dur) var(--ease-std)}
  .sb-shot:hover{box-shadow:var(--sh-2)}
  .sb-shot:last-child{margin-bottom:0}
  .sb-shot-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .sb-shot-h strong{color:var(--txt);font-size:12px}
  .sb-shot-h span{color:var(--txt-3);font-size:10px;font-family:monospace}
  .sb-shot-script{font-size:11px;color:var(--txt-2);line-height:1.55;margin-bottom:8px}
  .sb-shot-media{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
  .sb-mbx{aspect-ratio:16/9;border-radius:6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;color:var(--txt-3);border:1px solid var(--line-2);position:relative}
  .sb-mbx.img{background:linear-gradient(135deg,#e9eef6,#dbe6f3);color:#3b6fb5}
  .sb-mbx.vid{background:linear-gradient(135deg,#e6f4f1,#d6ece8);color:#1f9c86}
  .sb-mbx.vid.stale{background:linear-gradient(135deg,#fceccb,#f8ddaa);
    border-color:var(--amber-line);color:#a06a16}
  .sb-vid-stale{font-size:9px;color:#a8761b;cursor:pointer;position:absolute;top:4px;right:5px;
    background:#FFF7E6;border:1px solid var(--amber-line);border-radius:4px;padding:1px 5px}
  .sb-vid-stale:hover{background:#ffe9bf}
  .sb-vid-stale:active{transform:translateY(1px)}
  .sb-mbx-ico{font-size:22px;line-height:1}
  .sb-mbx-lab{font-size:9px;color:var(--txt-3)}
  .sb-mbx-act{font-size:9px;color:var(--accent);cursor:pointer;
    position:absolute;top:4px;right:5px;opacity:0;transition:opacity .15s}
  .sb-mbx:hover .sb-mbx-act{opacity:1}
  .sb-mbx .dl-icon{position:absolute;bottom:4px;right:5px;
    width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.92);
    border:1px solid var(--line);color:var(--txt-2);font-size:11px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:.15s;opacity:.7}
  .sb-mbx .dl-icon:hover{opacity:1;color:var(--accent);border-color:var(--accent)}
  .sb-edit{font-size:10px;color:var(--accent);cursor:pointer;opacity:0;transition:opacity .15s;margin-left:8px}
  .sb-shot-h:hover .sb-edit{opacity:1}
  .sb-regened{font-size:9px;color:var(--txt-3);line-height:1.5}
  .sb-regened.show{margin-top:2px}
  .sb-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .sb-tags .lab{font-size:10px;color:var(--txt-3)}
  .tag-chip{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;
    background:#eef3fb;color:var(--accent);border:1px solid #d8e4f5;
    cursor:default;box-shadow:var(--sh-1);transition:all .15s var(--ease-std)}
  .tag-chip:hover{box-shadow:0 3px 10px rgba(37,99,235,.25);transform:translateY(-1px)}
  .tag-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);
    box-shadow:0 3px 10px rgba(37,99,235,.3)}
  .tag-toggle{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  .tag-toggle .tag-chip{cursor:pointer}

  /* Side / Chat (right) */
  .side{width:400px;min-width:400px;display:flex;flex-direction:column;
    background:var(--panel);border-left:1px solid var(--line);
    box-shadow:-6px 0 24px rgba(28,28,30,.04)}
  .chat{flex:1;display:flex;flex-direction:column;min-height:0}
  .chat-h{padding:12px 20px;font-size:12.5px;font-weight:600;color:var(--txt);
    display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);
    background:var(--card);box-shadow:var(--sh-1);z-index:2}
  .chat-h .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .msgs{flex:1;overflow-y:auto;padding:14px 18px;display:flex;
    flex-direction:column;gap:10px;background:var(--panel)}
  .msg{padding:9px 13px;border-radius:12px;font-size:12.5px;line-height:1.55;
    max-width:88%;word-break:break-word;box-shadow:var(--sh-1);letter-spacing:.1px}
  .msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;
    box-shadow:0 4px 14px rgba(37,99,235,.28)}
  .msg.a{align-self:flex-start;background:var(--card);color:var(--txt);
    border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.system{align-self:center;background:transparent;border:1px dashed var(--wire);
    color:var(--txt-3);font-size:11.5px;padding:5px 11px;box-shadow:none;max-width:96%}
  .input-row{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--card);align-items:center}
  .input-row .ex-btn{
    padding:9px 11px;background:var(--panel);color:var(--txt-2);
    border:1px solid var(--line);border-radius:9px;
    font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;
    transition:.15s
  }
  .input-row .ex-btn:hover{border-color:var(--accent);color:var(--accent)}
  .input-row input{flex:1;padding:9px 13px;border:1px solid var(--line);border-radius:9px;
    font-size:12.5px;background:var(--card);color:var(--txt);outline:none}
  .input-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .input-row button{padding:9px 17px;background:var(--accent);color:#fff;border:none;
    border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;
    box-shadow:0 4px 14px rgba(37,99,235,.3);transition:all .15s var(--ease-std)}
  .input-row button:hover{filter:brightness(1.05)}
  .input-row button:active{transform:translateY(1px)}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(40,38,32,.45);display:flex;
    align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(6px)}
  .modal-box{width:440px;max-height:86vh;overflow-y:auto;background:var(--card);
    border-radius:14px;padding:22px;box-shadow:var(--sh-3);border:1px solid var(--line)}
  .modal-box h3{font-size:15px;margin-bottom:14px;font-family:var(--font-display);letter-spacing:.3px}
  .modal-box label{font-size:11px;color:var(--txt-2);font-weight:600;display:block;margin:12px 0 4px}
  .modal-box input,.modal-box textarea{width:100%;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;font-size:12.5px;background:var(--card);color:var(--txt);outline:none;
    font-family:inherit}
  .modal-box input:focus,.modal-box textarea:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .modal-box textarea{resize:vertical;min-height:64px;line-height:1.5}

<script>
/* ---------- 数据 ---------- */
const SCRIPT = {
  concept:'围绕深海生物发光展开科普，通过场景对比、生物细节展示，吸引小学生的注意力。',

    {t:'第1段', d:'60s', text:'水面以下一千米，阳光永远无法到达，但并非完全黑暗……'},

  ]
};

const ASSETS = [
  {id:'char_zhujiang', type:'人物', emoji:'🧑', name:'旁白者', desc:'沉稳中年男声形象，知识向导。圆脸、细框眼镜，浅蓝讲解员制服，冷蓝色统一。'},
  {id:'char_qianshuiyuan', type:'人物', emoji:'🤿', name:'潜水员', desc:'年轻活力探索者。橙色潜水服、护目镜，姿态前倾具探索感，主色橙对比冷蓝。'},
  {id:'scene_dehai', type:'场景', emoji:'🌊', name:'深海全景', desc:'海面下约1000米，无自然光，冷蓝调，悬浮颗粒感，远景渐隐。'},
  {id:'scene_faguang', type:'场景', emoji:'✨', name:'生物发光', desc:'暗背景中蓝绿光点，点光源柔和晕染，营造"海底星空"。'},
  {id:'scene_haimian', type:'场景', emoji:'🌌', name:'海面夜景', desc:'夜晚海面，星空倒映，上方微光、下方深蓝，用作转场衔接。'},
  {id:'prop_qianshuiqi', type:'道具', emoji:'🛥️', name:'潜水器', desc:'黄色小型探测潜水器，圆润机身、前置探照灯，辨识度高。'},
  {id:'prop_tanzhaodeng', type:'道具', emoji:'🔦', name:'探照灯', desc:'强光束道具，锥形光柱，亮黄白，用于突出主体。'},
];
const EMOJI_POOL = ['🧑','🤿','🌊','✨','🌌','🛥️','🔦','🐋','🪼','💡','🌠','🔭'];
const RUN_ID = 'vid_8f3a7c2e91';   // 当前 run 唯一标识（顶部状态条展示）

const SHOTS = [
  {id:'1-1', dur:'8s', cam:'固定', script:'海面阳光灿烂，镜头缓缓下移，画面渐暗过渡到深海。', tags:['scene_dehai','prop_qianshuiqi'], img:'🎨', vid:'🎬', imgNote:'', vidNote:'', vidStale:false},
  {id:'1-2', dur:'5s', cam:'特写', script:'黑暗中浮现一点蓝光，镜头拉近，光芒扩散。', tags:['scene_faguang'], img:'🎨', vid:'🎬', imgNote:'', vidNote:'', vidStale:false},
  {id:'1-3', dur:'7s', cam:'跟随', script:'潜水员穿过微光区，与发光生物擦身而过。', tags:['char_qianshuiyuan','scene_faguang'], img:'🎨', vid:'🎬', imgNote:'', vidNote:'', vidStale:false},
  {id:'2-1', dur:'6s', cam:'摇移', script:'横扫海底，发光生物与潜水员同框，如海底星空。', tags:['scene_dehai','char_qianshuiyuan'], img:'🎨', vid:'🎬', imgNote:'', vidNote:'', vidStale:false},
  {id:'2-2', dur:'6s', cam:'推进', script:'单只生物发出特定频率的光，仿佛在彼此交流。', tags:['scene_faguang','char_qianshuiyuan'], img:'🎨', vid:'🎬', imgNote:'', vidNote:'', vidStale:false},
];
const MEDIA_POOL = ['🎨','🖼️','🎞️','🌅','🪸','🐠','🫧','🐙'];

/* ---------- 阶段状态：依赖失效（stale）联动 ---------- */
const STALE = { script:false, asset:false, storyboard:false };
const LABELS = { script:'剧本', asset:'资产', storyboard:'分镜' };
function labelOf(s){ return LABELS[s]; }

function staleBannerHTML(stage){
  if(!STALE[stage]) return '';
  return '<div class="stale-banner">⚠ 此阶段因上游修改需重新生成 <button onclick="refreshStage(\''+stage+'\')">重新生成</button></div>';
}
function updateStaleBadges(){
  ['script','asset','storyboard'].forEach(stage=>{
    const card = document.getElementById('card-'+stage);
    if(card) card.classList.toggle('stale', !!STALE[stage]);
    const badge = document.getElementById('badge-'+stage);
    if(badge) badge.classList.toggle('hidden', !STALE[stage]);
  });
  const s = document.getElementById('scriptStaleBanner'); if(s) s.innerHTML = staleBannerHTML('script');
  const a = document.getElementById('assetStaleBanner'); if(a) a.innerHTML = staleBannerHTML('asset');
  const b = document.getElementById('sbStaleBanner');     if(b) b.innerHTML = staleBannerHTML('storyboard');
}
function applyStale(source, downstream){
  downstream.forEach(s => STALE[s] = true);
  updateStaleBadges();
  const names = downstream.map(labelOf).join('、');
  agentSay('✎ 同步：你修改了「'+labelOf(source)+'」，已写入 run_state。下游「'+names+'」标记为待刷新，需重新生成后保持一致。');
}
function refreshStage(stage){
  STALE[stage] = false;
  updateStaleBadges();
  agentSay('↻ 已重新生成「'+labelOf(stage)+'」，与最新 run_state 对齐。');
}

/* ---------- 顶部状态条更新 ---------- */
function syncTopbar(){
  document.getElementById('tbRunId').textContent = RUN_ID;
  document.getElementById('tbStage').textContent = SCRIPT.user.style ? SCRIPT.user.style+'剧本' : '剧本';
  document.getElementById('tbDur').textContent   = SCRIPT.user.duration+' · '+SCRIPT.user.ratio;
  document.getElementById('tbStyle').textContent = SCRIPT.user.style+' · '+SCRIPT.user.voice;
}
function setStageLabel(stageLabel){
  document.getElementById('tbStage').textContent = stageLabel;
}

/* ---------- 渲染：剧本卡片 ---------- */
function renderScript(){
  const u = SCRIPT.user;
  const assetList =
    `<li><b>人物</b>：${ASSETS.filter(a=>a.type==='人物').map(a=>a.name).join(' / ')}</li>`+
    `<li><b>场景</b>：${ASSETS.filter(a=>a.type==='场景').map(a=>a.name).join(' / ')}</li>`+
    `<li><b>道具</b>：${ASSETS.filter(a=>a.type==='道具').map(a=>a.name).join(' / ')}</li>`;
  document.getElementById('scriptContent').innerHTML = `
    <div id="scriptStaleBanner"></div>
    <div class="edit-bar"><div class="asset-btn" onclick="event.stopPropagation();openScriptEdit()">✎ 编辑剧本</div></div>
    <h2>创意设计</h2>
    <p>${SCRIPT.concept}</p>
    <h3>用户设定</h3>
    <ul>
      <li>🎨 风格：${u.style}</li>
      <li>⏱ 时长：${u.duration}</li>
      <li>📐 比例：${u.ratio}</li>
      <li>📱 平台：${u.platform}</li>
      <li>🎙 旁白：${u.voice}</li>
      <li>🎯 受众：${u.audience}</li>
    </ul>
    <h3>资产列表</h3>
    <ul>${assetList}</ul>
    <h3>绑定关系表</h3>
    <table class="sb-table">
      <thead><tr><th>类型</th><th>名称</th><th>绑定用途</th><th>参考图</th><th>音色描述</th></tr></thead>
      <tbody id="bindRows"></tbody>
    </table>
    <h3>具体剧本</h3>
    ${SCRIPT.sections.map(s=>`<p><b>${s.t}</b>（${s.d}）${s.text}</p>`).join('')}
  `;
  renderBind();
}

/* ---------- 编辑剧本 modal ---------- */
function openScriptEdit(){
  document.getElementById('sConcept').value = SCRIPT.concept;
  document.getElementById('sStyle').value = SCRIPT.user.style;
  document.getElementById('sDur').value = SCRIPT.user.duration;
  document.getElementById('sRatio').value = SCRIPT.user.ratio;
  document.getElementById('sPlat').value = SCRIPT.user.platform;
  document.getElementById('sVoice').value = SCRIPT.user.voice;
  document.getElementById('sAud').value = SCRIPT.user.audience;
  document.getElementById('sSections').innerHTML = SCRIPT.sections.map((s,i)=>
    `<label>${s.t}（${s.d}）</label><textarea id="sSec${i}">${s.text}</textarea>`
  ).join('');
  document.getElementById('scriptModal').classList.remove('hidden');
}
function closeScriptModal(){ document.getElementById('scriptModal').classList.add('hidden'); }
function saveScriptEdit(){
  SCRIPT.concept = document.getElementById('sConcept').value.trim()||SCRIPT.concept;
  SCRIPT.user.style = document.getElementById('sStyle').value.trim()||SCRIPT.user.style;
  SCRIPT.user.duration = document.getElementById('sDur').value.trim()||SCRIPT.user.duration;
  SCRIPT.user.ratio = document.getElementById('sRatio').value.trim()||SCRIPT.user.ratio;
  SCRIPT.user.platform = document.getElementById('sPlat').value.trim()||SCRIPT.user.platform;
  SCRIPT.user.voice = document.getElementById('sVoice').value.trim()||SCRIPT.user.voice;
  SCRIPT.user.audience = document.getElementById('sAud').value.trim()||SCRIPT.user.audience;
  SCRIPT.sections.forEach((s,i)=>{ s.text = (document.getElementById('sSec'+i).value.trim())||s.text; });
  closeScriptModal();
  renderScript();
  syncTopbar();
  applyStale('script', ['asset','storyboard']);
}

/* ---------- 编辑分镜 ---------- */
let editingShot = null;
function openShotEdit(id){
  const s = SHOTS.find(x=>x.id===id);
  editingShot = id;
  document.getElementById('shotIdLab').textContent = s.id;
  document.getElementById('shotCam').value = s.cam;
  document.getElementById('shotDur').value = s.dur;
  document.getElementById('shotScript').value = s.script;
  document.getElementById('shotTags').innerHTML = ASSETS.map(a =>
    `<span class="tag-chip ${s.tags.includes(a.id)?'on':''}" data-id="${a.id}" onclick="toggleShotTag(this,'${a.id}')">#${a.name}</span>`
  ).join('');
  document.getElementById('shotModal').classList.remove('hidden');
}
function toggleShotTag(el, id){
  el.classList.toggle('on');
}
function closeShotModal(){ document.getElementById('shotModal').classList.add('hidden'); editingShot=null; }
function saveShotEdit(){
  const s = SHOTS.find(x=>x.id===editingShot);
  s.cam = document.getElementById('shotCam').value.trim()||s.cam;
  s.dur = document.getElementById('shotDur').value.trim()||s.dur;
  s.script = document.getElementById('shotScript').value.trim()||s.script;
  s.tags = Array.from(document.querySelectorAll('#shotTags .tag-chip.on')).map(e=>e.dataset.id);
  s.vidStale = true;
  closeShotModal();
  renderSb();
  renderNavShots();
  agentSay('✎ 同步：你修改了分镜「'+s.id+'」（脚本/镜头/时长/关联资产），已写入 run_state。该分镜的视频已标记待重生成，需重新生成后保持一致。');
}

/* ---------- 渲染：资产卡片 ---------- */
let curFilter = '全部';
const TABS = ['全部','人物','场景','道具'];

function renderTabs(){
  const el = document.getElementById('assetTabs');
  el.innerHTML = TABS.map(t =>
    `<div class="asset-tab ${t===curFilter?'on':''}" onclick="setFilter('${t}')">${t}</div>`
  ).join('');
}
function setFilter(t){
  curFilter = t;
  renderTabs();
  renderAssets();
  renderNavAssets();   // 同步过滤左侧导航
}
function renderAssets(){
  const grid = document.getElementById('assetGrid');
  const list = ASSETS.filter(a => curFilter==='全部' || a.type===curFilter);
  grid.innerHTML = list.map(a => `
    <div class="asset-item">
      <div class="asset-thumb">
        <span class="asset-type">${a.type}</span>
        <span id="thumb-${a.id}">${a.emoji}</span>
        <div class="download-overlay" title="下载图片" onclick="event.stopPropagation();downloadAsset('${a.id}')">⬇</div>
      </div>
      <div class="asset-info">
        <div class="asset-name">${a.name}</div>
        <div class="asset-desc">${a.desc}</div>
        <div class="asset-actions">
          <div class="asset-btn" onclick="openEdit('${a.id}')">✎ 编辑</div>
          <div class="asset-btn regen" onclick="regen('${a.id}')">↻ 重生成</div>
          <div class="asset-btn" onclick="downloadAsset('${a.id}')" title="下载图片">⬇</div>
        </div>
        <div class="asset-regened" id="regen-${a.id}"></div>
      </div>
    </div>
  `).join('');
}

/* ---------- 左侧导航栏 ---------- */
function renderNavAssets(){
  const el = document.getElementById('navAssets');
  if(!el) return;
  const list = ASSETS.filter(a => curFilter==='全部' || a.type===curFilter);
  if(!list.length){
    el.innerHTML = '<div class="nav-empty">无资产</div>';
    return;
  }
  el.innerHTML = list.map(a => `
    <div class="nav-thumb" title="${a.name} · ${a.type}"
         onclick="scrollToAsset('${a.id}')">

/* ---------- 下载：通用 ---------- */
function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>{ t.classList.remove('show'); }, 1800);
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}
function emojiToPng(emoji, w, h, bg, fg, label){
  const cnv = document.createElement('canvas');
  cnv.width=w; cnv.height=h;
  const ctx = cnv.getContext('2d');
  // 背景
  const grad = ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0, bg[0]); grad.addColorStop(1, bg[1]);
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
  // emoji
  ctx.font = `${Math.floor(h*0.55)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = fg;
  ctx.fillText(emoji, w/2, h/2 - 8);
  // 标签
  if(label){
    ctx.font = `600 14px ${getComputedStyle(document.body).fontFamily}`;
    ctx.fillStyle = 'rgba(28,28,30,.78)';
    ctx.fillText(label, w/2, h - 22);
  }
  return new Promise(res=> cnv.toBlob(b=>res(b), 'image/png'));
}
async function downloadAsset(id){
  const a = ASSETS.find(x=>x.id===id);
  const blob = await emojiToPng(a.emoji, 640, 400, ['#E9EEF6','#DDE7F2'], '#3B6FB5', a.name+' · '+a.type);
  if(!blob){ showToast('下载失败'); return; }
  downloadBlob(blob, `asset_${a.id}_${a.name}.png`);
  showToast('已下载：'+a.name);
}
async function downloadShotImg(id){
  const s = SHOTS.find(x=>x.id===id);
  const blob = await emojiToPng(s.img, 640, 360, ['#E9EEF6','#DBE6F3'], '#3B6FB5', '分镜 '+s.id+' · 分镜图');
  if(!blob){ showToast('下载失败'); return; }
  downloadBlob(blob, `shot_${s.id}_img.png`);
  showToast('已下载：分镜 '+s.id+' 图');
}
// 视频下载（占位：实际接视频生成工具后改为真实 mp4）
function downloadShotVid(id){
  const s = SHOTS.find(x=>x.id===id);
  const meta = {
    id:s.id, duration:s.dur, camera:s.cam, script:s.script,
    tags:s.tags.map(t=>({id:t, name:(ASSETS.find(a=>a.id===t)?.name)||t})),
    placeholder:true,
    note:'视频生成工具未接入，先用 JSON 占位；接入后改为 .mp4 真实下载。'
  };
  const blob = new Blob([JSON.stringify(meta,null,2)], {type:'application/json'});
  downloadBlob(blob, `shot_${s.id}_video.mp4`);
  showToast('已下载占位：分镜 '+s.id+' 视频（JSON 暂代）');
}

/* send() 根据当前 active 节点真正调用对应分支（与左侧画布联动） */
function send(){
  const inp=document.getElementById('ci');
  const v=inp.value.trim();
  if(!v) return;
  addMsg(v,'u');
  inp.value='';
  setTimeout(()=>{
    const card = document.querySelector('.card.active');
    const stage = card?.dataset.stage || 'script';
    handleUserInstruction(stage, v);
  }, 450);
}

function handleUserInstruction(stage, v){
  // 通用兜底
  const summary = v.length>22 ? v.slice(0,22)+'…' : v;
  if(stage==='script'){
    // 改剧本 → 触发下游 stale
    agentSay('好的，已记下你对剧本的建议：「'+summary+'」。'+(STALE.script?'':'我会在下一步生成时同步进去——')) ;
    // 顺势把"创意设计/段落"提示一下
    if(/潜|海|光|色|节奏|慢|快|亮|暗|声音|旁白|儿童|小学生|科普/.test(v)){
      agentSay('✎ 已将本条建议写入 run_state（剧本段）。下游「资产」「分镜」标记为待刷新，重新生成后保持一致。');
      applyStale('script', ['asset','storyboard']);
    } else {
      sysSay('提示：如修改的是创意/段落文本，建议点剧本卡片右上的 ✎ 直接编辑');
    }
  } else if(stage==='asset'){
    if(/换|改|重新|重生|变|新/.test(v)){
      // 找名字匹配
      const hit = ASSETS.find(a=>v.indexOf(a.name)>=0);
      if(hit){
        regen(hit.id);
      } else {
        agentSay('请告诉我要重新生成哪个资产（例如：潜航者 / 深海全景 / 探照灯 ……）');
      }
    } else {
      agentSay('好的，已记录。你可以直接「点资产卡上的 ✎ 编辑」或「点 ↻ 重生成」让 Agent 实时修改。');
    }
  } else if(stage==='storyboard'){
    const m = v.match(/(\d-\d)/);
    const hit = m ? SHOTS.find(s=>s.id===m[1]) : null;
    if(/图|重新/.test(v) && hit){
      regenShotImg(hit.id);
    } else if(/视频|动画|动/.test(v) && hit){
      regenShotVid(hit.id);
    } else if(hit){
      openShotEdit(hit.id);
      agentSay('已打开分镜 '+hit.id+' 的编辑面板，保存后会触发该分镜视频重生成。');
    } else {
      agentSay('你的指令与某个分镜对应不上，请按"分镜 1-2 重生视频"的格式告诉我。');
    }
  } else {
    agentSay('收到：「'+summary+'」。');
  }
}

  sysSay('本次新增 '+(msgsEl.children.length-before)+' 轮对话演示 · 都已与左侧画布元素一一对应');
}

/* ---------- 初始化 ---------- */
renderTabs();
renderAssets();
renderScript();
renderSb();
renderNavAssets();
renderNavShots();
resetAll();
</script>
</body>
