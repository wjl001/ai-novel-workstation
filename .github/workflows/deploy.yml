name: Deploy 2.7 Branch Docs
on:
  push:
    branches: ["2.7"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-2.7"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: 2.7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies + vitepress
        run: |
          npm ci
          npm install vitepress -D

      - name: Build docs static site
        run: npm run docs:build

      - name: Create CNAME file
        run: echo "ai-novel-2.7.taokedan.cn" > docs/.vitepress/dist/CNAME

      - name: Upload site artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy-site:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
